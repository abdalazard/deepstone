name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1"

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export Web (HTML5)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export directory
        run: |
          mkdir -v -p build/web

      - name: Godot Web Export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_version: ${{ env.GODOT_VERSION }}
          godot_channel: "stable"
          export_debug: false
          use_preset_export_path: true
          create_release: false
          relative_project_path: ""

      - name: Ensure Cross-Origin Isolation for GitHub Pages
        run: |
          curl -sSL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js -o build/web/coi-serviceworker.js
          sed -i 's/<head>/<head><script src="coi-serviceworker.js"><\/script>/' build/web/index.html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export_web
    runs-on: ubuntu-latest
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
